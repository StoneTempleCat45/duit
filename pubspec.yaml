name: duit
description: "Duit - a simple, offline personal budget tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Local database (SQLite)
  drift: ^2.26.0
  drift_flutter: '>=0.2.0 <1.0.0'

  # Formatting and IDs
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.5.0

  # Android home screen widget
  home_widget: '>=0.7.0 <1.0.0'

  # Charts
  fl_chart: '>=0.70.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

  # Generates the database code (app_database.g.dart)
  drift_dev: ^2.26.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
